<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Static Website</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Welcome to My Static Site</h1>
    <nav>
      <ul>
        <li><a href="#home" onclick="navigate('home')">Home</a></li>
        <li><a href="#about" onclick="navigate('about')">About</a></li>
        <li><a href="#contact" onclick="navigate('contact')">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main id="content">
    <section id="home">
      <h2>Home</h2>
      <p>This is the homepage of my static website hosted on AWS S3.</p>
    </section>
    <section id="about" style="display:none;">
      <h2>About</h2>
      <p>This site is deployed automatically using GitHub Actions.</p>
    </section>
    <section id="contact" style="display:none;">
      <h2>Contact</h2>
      <p>You can reach me at: <a href="mailto:example@email.com">example@email.com</a></p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 My Static Website</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
